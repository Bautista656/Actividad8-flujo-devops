name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - main

jobs:
  verificar-proyecto:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: echo "Instalando dependencias del proyecto"

      - name: Ejecutar pruebas
        run: echo "Ejecutando pruebas automáticas"

      - name: Construir proyecto
        run: echo "Construyendo aplicación web"

      - name: Despliegue automático
        run: echo "Desplegando aplicación después del merge a main"